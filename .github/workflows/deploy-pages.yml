name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # ВАЖНО: не вешать здесь `environment: github-pages` — job часто падает/зависает (reviewers, policy).
    # CRM для Vite: **Repository secrets** и/или **Repository variables** (Settings → Secrets and variables → Actions).
    # Имена: SUPABASE_URL, SUPABASE_ANON_KEY (в workflow: secrets || vars — сначала Secrets, иначе Variables).
    steps:
      - name: Link to this workflow run
        run: echo "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pairs: Repository Secrets **или** Repository Variables (одинаковые имена).
      - name: Check CRM env (secrets or variables)
        env:
          SUPA_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPA_ANON: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          VURL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VANON: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if { [ -n "$SUPA_URL" ] && [ -n "$SUPA_ANON" ]; } || { [ -n "$VURL" ] && [ -n "$VANON" ]; }; then
            echo "::notice::CRM: задана пара SUPABASE_* или VITE_* (secrets и/или variables)"
          else
            echo "::warning::CRM: пусто. Добавь в репо Actions → **Secrets** или **Variables** пары URL+anon (имена: SUPABASE_URL, SUPABASE_ANON_KEY) или VITE_*. Только Environments (без дублирования в репо) build не увидит."
          fi

      - name: Debug CRM presence (lengths only)
        env:
          S_U: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          S_A: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          V_U: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          V_A: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Lengths: SUPABASE_URL=${#S_U} SUPABASE_ANON_KEY=${#S_A} VITE_URL=${#V_U} VITE_ANON=${#V_A}"
          if { [ -n "$S_U" ] && [ -n "$S_A" ]; } || { [ -n "$V_U" ] && [ -n "$V_A" ]; }; then
            echo "::notice::CRM: secrets present for Vite build"
          else
            echo "::warning::CRM: both pairs empty — bundle will have no Supabase URL/key (key icon will show error)"
          fi

      - name: Write .env.production for Vite
        run: |
          u="$S_U"; a="$S_A"
          if [ -z "$u" ] || [ -z "$a" ]; then u="$V_U"; a="$V_A"; fi
          if [ -n "$u" ] && [ -n "$a" ]; then
            # SUPABASE_* для pickEnv; VITE_* — для import.meta.env.* в Vite (дублируем те же значения).
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$u" "$a" >> .env.production
            printf "VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n" "$u" "$a" >> .env.production
          fi
          [ -n "$S_F" ] && printf "FUNCTIONS_BASE_URL=%s\n" "$S_F" >> .env.production
          [ -n "$V_F" ] && printf "VITE_SUPABASE_FUNCTIONS_BASE_URL=%s\n" "$V_F" >> .env.production
        env:
          S_U: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          S_A: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          S_F: ${{ secrets.FUNCTIONS_BASE_URL || vars.FUNCTIONS_BASE_URL }}
          V_U: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          V_A: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          V_F: ${{ secrets.VITE_SUPABASE_FUNCTIONS_BASE_URL || vars.VITE_SUPABASE_FUNCTIONS_BASE_URL }}

      - name: Build project
        env:
          CUSTOM_DOMAIN_BUILD: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          FUNCTIONS_BASE_URL: ${{ secrets.FUNCTIONS_BASE_URL || vars.FUNCTIONS_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_FUNCTIONS_BASE_URL: ${{ secrets.VITE_SUPABASE_FUNCTIONS_BASE_URL || vars.VITE_SUPABASE_FUNCTIONS_BASE_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
